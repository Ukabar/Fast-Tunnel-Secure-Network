workflows:
  testFlight:
    name: "Fast Tunnel iOS TestFlight"

    integrations:
      app_store_connect: SpeedTeste

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zyverio.fasttunnel

    scripts:
      - name: Clean Flutter build artifacts
        script: |
          set -e
          flutter clean

      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get

      - name: Verify formatting
        script: |
          set -e
          dart format --output=none --set-exit-if-changed .

      - name: Analyze project
        script: |
          set -e
          flutter analyze

      - name: Run tests
        script: |
          set -e
          flutter test

      - name: Set up iOS code signing
        script: |
          set -e

          xcode-project use-profiles

          echo "Checking generated export options..."
          test -f /Users/builder/export_options.plist

          echo "Available signing identities:"
          security find-identity -v -p codesigning || true

          echo "Installed provisioning profiles:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true

      - name: Verify iOS App Store icons
        script: |
          python3 - <<'PY'
          import pathlib
          import struct
          import sys

          icon_dir = pathlib.Path(
              "ios/Runner/Assets.xcassets/AppIcon.appiconset"
          )

          if not icon_dir.exists():
              print(f"AppIcon directory not found: {icon_dir}")
              sys.exit(1)

          failures = []
          png_files = sorted(icon_dir.glob("*.png"))

          if not png_files:
              print("No PNG files found in the iOS AppIcon set.")
              sys.exit(1)

          def png_info(path):
              data = path.read_bytes()

              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  failures.append(f"{path.name}: not a PNG file")
                  return

              if len(data) < 26:
                  failures.append(f"{path.name}: invalid PNG structure")
                  return

              width, height, bit_depth, color_type = struct.unpack(
                  ">IIBB",
                  data[16:26],
              )

              offset = 8
              has_trns = False

              while offset + 12 <= len(data):
                  length = struct.unpack(
                      ">I",
                      data[offset:offset + 4],
                  )[0]

                  chunk_type = data[offset + 4:offset + 8]

                  if chunk_type == b"tRNS":
                      has_trns = True

                  offset += 12 + length

                  if chunk_type == b"IEND":
                      break

              if color_type in (4, 6) or has_trns:
                  failures.append(
                      f"{path.name}: "
                      f"{width}x{height}, "
                      f"color_type={color_type}, "
                      f"tRNS={has_trns}"
                  )

          for path in png_files:
              png_info(path)

          if failures:
              print(
                  "Invalid iOS AppIcon PNG files "
                  "with alpha/transparency:"
              )
              print("\n".join(failures))
              sys.exit(1)

          print(
              "All iOS AppIcon PNG files are opaque "
              "and contain no transparency."
          )
          PY

      - name: Build signed IPA
        script: |
          set -euo pipefail

          echo "Flutter version:"
          flutter --version

          echo "Xcode version:"
          xcodebuild -version

          echo "Bundle identifier:"
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" \
            ios/Runner.xcodeproj/project.pbxproj || true

          echo "Starting signed IPA build..."

          flutter build ipa \
            --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

          echo "Build command completed."

          IPA_PATH="$(
            find "$CM_BUILD_DIR/build/ios/ipa" \
              -maxdepth 1 \
              -type f \
              -name "*.ipa" \
              -print \
              -quit 2>/dev/null || true
          )"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA was generated."

            echo "Searching project for IPA files:"
            find "$CM_BUILD_DIR" -type f -name "*.ipa" -print || true

            echo "Searching for Xcode archives:"
            find "$CM_BUILD_DIR" \
              -type d \
              -name "*.xcarchive" \
              -print || true

            exit 1
          fi

          echo "IPA successfully generated:"
          echo "$IPA_PATH"
          ls -lh "$IPA_PATH"

      - name: Verify packaged Fast Tunnel app
        script: |
          set -euo pipefail

          IPA_PATH="$(
            find "$CM_BUILD_DIR/build/ios/ipa" \
              -maxdepth 1 \
              -type f \
              -name "*.ipa" \
              -print \
              -quit 2>/dev/null || true
          )"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA found for verification."
            exit 1
          fi

          VERIFY_DIR="/tmp/fast_tunnel_ipa"

          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"

          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"

          APP_PATH="$(
            find "$VERIFY_DIR/Payload" \
              -maxdepth 1 \
              -type d \
              -name "*.app" \
              -print \
              -quit 2>/dev/null || true
          )"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No packaged .app found inside IPA."
            find "$VERIFY_DIR" -maxdepth 4 -print || true
            exit 1
          fi

          echo "Packaged application:"
          echo "$APP_PATH"

          echo "Packaged bundle identifier:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"

          echo "Packaged display name:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            "$APP_PATH/Info.plist" || true

          PACKAGED_BUNDLE_ID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP_PATH/Info.plist"
          )"

          if [ "$PACKAGED_BUNDLE_ID" != "com.zyverio.fasttunnel" ]; then
            echo "ERROR: Unexpected bundle identifier:"
            echo "$PACKAGED_BUNDLE_ID"
            exit 1
          fi

          if [ ! -f "$APP_PATH/Assets.car" ]; then
            echo "ERROR: Assets.car was not found."
            find "$APP_PATH" -maxdepth 2 -print || true
            exit 1
          fi

          assetutil --info "$APP_PATH/Assets.car" \
            > "$VERIFY_DIR/assets-car-info.json"

          echo "Packaged Fast Tunnel app verified."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/fast_tunnel_ipa/assets-car-info.json

    publishing:
      email:
        recipients:
          - hornet.devlo@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
